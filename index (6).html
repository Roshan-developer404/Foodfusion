<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F5B82E">
<meta name="description" content="FoodFusion: biryani, tiffins, snacks, desserts and dinner. Cooked when you order, tracked until it arrives.">
<title>FoodFusion | Hot biryani, crisp dosa, at your door</title>
<!-- Runs before React so the page never flashes the wrong theme -->
<script>
  try {
    var t = localStorage.getItem('ff_theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- React draws the whole app inside this one div -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
